## Gunicorn Service Configuration

## bind address
HOST=0.0.0.0

## listen port
PORT=5000

## number of gunicorn worker processes
WORKERS=4

## number of threads per worker
PROCESSES=4

## worker request timeout in seconds
TIMEOUT=120

## gunicorn log level (debug, info, warning, error)
LOG_LEVEL=info

## access log path (- for stdout)
ACCESS_LOG=-

## error log path (- for stderr)
ERROR_LOG=-
