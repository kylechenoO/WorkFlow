## =============================================================
## Backend Service Configuration (gunicorn + Flask REST API)
## =============================================================

## bind address
BACKEND_HOST=0.0.0.0

## listen port
BACKEND_PORT=5001

## number of gunicorn worker processes (1 required for APScheduler)
BACKEND_WORKERS=1

## number of threads per worker
BACKEND_THREADS=4

## worker request timeout in seconds
BACKEND_TIMEOUT=120

## gunicorn log level (debug, info, warning, error)
BACKEND_LOG_LEVEL=info

## access log path (- for stdout)
BACKEND_ACCESS_LOG=-

## error log path (- for stderr)
BACKEND_ERROR_LOG=-

## =============================================================
## Frontend Service Configuration (gunicorn + Django)
## =============================================================

## bind address
FRONTEND_HOST=0.0.0.0

## listen port
FRONTEND_PORT=5002

## number of gunicorn worker processes
FRONTEND_WORKERS=4

## number of threads per worker
FRONTEND_THREADS=4

## worker request timeout in seconds
FRONTEND_TIMEOUT=120

## gunicorn log level (debug, info, warning, error)
FRONTEND_LOG_LEVEL=info

## access log path (- for stdout)
FRONTEND_ACCESS_LOG=-

## error log path (- for stderr)
FRONTEND_ERROR_LOG=-
