<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="6" fill="#0f172a"/>
  <!-- chip body -->
  <rect x="9" y="9" width="14" height="14" rx="2" fill="none" stroke="#e2e8f0" stroke-width="1.5"/>
  <!-- pins left -->
  <line x1="9" y1="12" x2="6" y2="12" stroke="#e2e8f0" stroke-width="1.2"/>
  <line x1="9" y1="16" x2="6" y2="16" stroke="#e2e8f0" stroke-width="1.2"/>
  <line x1="9" y1="20" x2="6" y2="20" stroke="#e2e8f0" stroke-width="1.2"/>
  <!-- pins right -->
  <line x1="23" y1="12" x2="26" y2="12" stroke="#e2e8f0" stroke-width="1.2"/>
  <line x1="23" y1="16" x2="26" y2="16" stroke="#e2e8f0" stroke-width="1.2"/>
  <line x1="23" y1="20" x2="26" y2="20" stroke="#e2e8f0" stroke-width="1.2"/>
  <!-- pins top -->
  <line x1="13" y1="9" x2="13" y2="6" stroke="#e2e8f0" stroke-width="1.2"/>
  <line x1="19" y1="9" x2="19" y2="6" stroke="#e2e8f0" stroke-width="1.2"/>
  <!-- pins bottom -->
  <line x1="13" y1="23" x2="13" y2="26" stroke="#e2e8f0" stroke-width="1.2"/>
  <line x1="19" y1="23" x2="19" y2="26" stroke="#e2e8f0" stroke-width="1.2"/>
  <!-- chip fill -->
  <rect x="12" y="12" width="8" height="8" rx="1" fill="#e2e8f0"/>
</svg>
