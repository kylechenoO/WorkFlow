{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - WorkFlow</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #1a1c2e 0%, #2d325a 50%, #1a1c2e 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .login-card {
      width: 100%;
      max-width: 420px;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      overflow: hidden;
    }
    .login-header {
      background: linear-gradient(135deg, #4a6cf7 0%, #6366f1 100%);
      color: #fff;
      padding: 32px 32px 28px;
      text-align: center;
    }
    .login-header h3 {
      margin: 0 0 4px;
      font-weight: 700;
      font-size: 1.5rem;
    }
    .login-header p {
      margin: 0;
      opacity: 0.85;
      font-size: 0.9rem;
    }
    .login-body {
      padding: 32px;
    }
    .login-body .form-label {
      font-weight: 600;
      font-size: 0.85rem;
      color: #4a5568;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .login-body .form-control {
      border-radius: 8px;
      padding: 10px 14px;
      border: 1.5px solid #e2e8f0;
      font-size: 0.95rem;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .login-body .form-control:focus {
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
    }
    .btn-login {
      background: linear-gradient(135deg, #4a6cf7 0%, #6366f1 100%);
      border: none;
      border-radius: 8px;
      padding: 11px;
      font-weight: 600;
      font-size: 1rem;
      letter-spacing: 0.3px;
      transition: opacity 0.2s, transform 0.1s;
    }
    .btn-login:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }
    .btn-login:active {
      transform: translateY(0);
    }
    .alert {
      border-radius: 8px;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-header">
      <h3><i class="bi bi-diagram-3"></i> WorkFlow</h3>
      <p>Sign in to your account</p>
    </div>
    <div class="login-body">
      {% if messages %}
      {% for message in messages %}
      <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
        {{ message }}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>
      {% endfor %}
      {% endif %}

      <form method="post">
        {% csrf_token %}
        <div class="mb-3">
          <label for="username" class="form-label">Username</label>
          <input type="text" class="form-control" id="username" name="username" placeholder="Enter your username" required autofocus>
        </div>
        <div class="mb-4">
          <label for="password" class="form-label">Password</label>
          <input type="password" class="form-control" id="password" name="password" placeholder="Enter your password" required>
        </div>
        <button type="submit" class="btn btn-primary btn-login w-100">Sign In</button>
      </form>
    </div>
  </div>

  <!-- Bootstrap 5 JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
