{% extends "base.html" %}

{% block title %}Workflow Not Found - WorkFlow{% endblock %}
{% block page_title %}Workflow Not Found{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-md-6">
    <div class="card text-center">
      <div class="card-body py-5">
        <i class="bi bi-exclamation-triangle text-warning" style="font-size:3rem;"></i>
        <h4 class="mt-3">Workflow Not Found</h4>
        <p class="text-muted mb-4">
          The workflow <strong>{{ flow_name }}</strong> does not exist or has been deleted.
        </p>
        <a href="{% url 'workflows:flow_list' %}" class="btn btn-primary">
          <i class="bi bi-arrow-left"></i> Back to Workflows
        </a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
